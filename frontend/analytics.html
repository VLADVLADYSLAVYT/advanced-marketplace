<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналітика - Advanced Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-bottom: 2rem;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }
        
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .product-selector {
            margin-bottom: 2rem;
        }
        
        .product-selector select {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">📊 Аналітика Marketplace</div>
            <div class="navbar-menu">
                <a href="index.html" class="nav-link">Товари</a>
                <a href="analytics.html" class="nav-link active">Аналітика</a>
                <a href="profile.html" class="nav-link">Профіль</a>
                <a href="transactions.html" class="nav-link">Транзакції</a>
            </div>
        </nav>

        <main class="main-content">
            <h1 style="color: white; margin-bottom: 2rem;">Аналітика ринку</h1>

            <div class="analytics-container">
                <div class="product-selector">
                    <label for="productSelect">Виберіть товар:</label>
                    <select id="productSelect" onchange="loadProductAnalytics()">
                        <option value="">Завантаження товарів...</option>
                    </select>
                </div>

                <div class="metrics-grid" id="metricsGrid">
                    <div class="metric-card">
                        <div class="metric-label">Поточна ціна</div>
                        <div class="metric-value" id="currentPrice">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Базова ціна</div>
                        <div class="metric-value" id="basePrice">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Індекс попиту</div>
                        <div class="metric-value" id="demandIndex">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Індекс пропозиції</div>
                        <div class="metric-value" id="supplyIndex">-</div>
                    </div>
                </div>

                <h2 style="margin-top: 2rem; margin-bottom: 1rem;">Історія цін (7 днів)</h2>
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>

                <h2 style="margin-bottom: 1rem;">Індекси попиту/пропозиції</h2>
                <div class="chart-wrapper">
                    <canvas id="indicesChart"></canvas>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 Advanced Marketplace. Усі права захищені.</p>
        </footer>
    </div>

    <script src="analytics.js"></script>
</body>
</html>
